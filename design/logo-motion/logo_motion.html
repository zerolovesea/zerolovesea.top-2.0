<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zerolovesea · cat in motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #666;
      --accent: #444b54;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 336px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      border:0; padding:8px; background:#f7f7f7; border-radius:6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 104px;
      height: 94px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    :focus-visible {outline:2px solid #444b54;outline-offset:5px;}
    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      font-size:12px;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      #logo-root svg {
        --p2m-duration:1800ms;
        --p2m-ease-enter:cubic-bezier(.34,0,.14,1);
        --p2m-ease-settle:cubic-bezier(.22,1,.36,1);
        --p2m-ease-gentle:cubic-bezier(.4,0,.2,1);
      }
      #logo-root #mark{transform-box:view-box;transform-origin:161px 214px;animation:p2m-arrive var(--p2m-duration) linear both}
      #logo-root #tail{transform-box:view-box;transform-origin:139px 214px;animation:p2m-tail var(--p2m-duration) linear both}
      #logo-root #body-fill{animation:p2m-body-fill var(--p2m-duration) linear both}
      #logo-root #tail-fill{animation:p2m-tail-fill var(--p2m-duration) linear both}
      #logo-root :is(#tail-line,#body-line,#leg-left,#leg-right,#chest){stroke-dasharray:1 1.2}
      #logo-root #tail-line{animation:p2m-tail-draw var(--p2m-duration) linear both}
      #logo-root #body-line{animation:p2m-body-draw var(--p2m-duration) linear both}
      #logo-root #leg-left{animation:p2m-left-draw var(--p2m-duration) linear both}
      #logo-root #leg-right{animation:p2m-right-draw var(--p2m-duration) linear both}
      #logo-root #chest{animation:p2m-chest-draw var(--p2m-duration) linear both}
      #logo-root :is(#eye-left,#eye-right){transform-box:fill-box;transform-origin:center}
      #logo-root #eye-left{animation:p2m-left-eye var(--p2m-duration) linear both}
      #logo-root #eye-right{animation:p2m-right-eye var(--p2m-duration) linear both}
      @keyframes p2m-arrive{
        0%{transform:translate(-2px,9px) scale(.96);animation-timing-function:cubic-bezier(.4,0,.2,1)}
        20%{transform:translate(-2px,12px) scale(.94);animation-timing-function:cubic-bezier(.34,0,.14,1)} /* enter */
        63%{transform:translate(0,-1.5px) scale(1.015);animation-timing-function:cubic-bezier(.22,1,.36,1)} /* settle */
        84%{transform:translate(0,.3px) scale(.998);animation-timing-function:cubic-bezier(.4,0,.2,1)}
        100%{transform:none}
      }
      @keyframes p2m-tail{
        0%,12%{transform:rotate(4deg);animation-timing-function:cubic-bezier(.4,0,.2,1)}
        47%{transform:rotate(-3deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}
        77%{transform:rotate(1.2deg);animation-timing-function:cubic-bezier(.4,0,.2,1)}
        100%{transform:none}
      }
      @keyframes p2m-tail-draw{
        0%,6%{stroke-dashoffset:1.1;animation-timing-function:cubic-bezier(.34,0,.14,1)}
        49%,100%{stroke-dashoffset:0}
      }
      @keyframes p2m-body-draw{
        0%,21%{stroke-dashoffset:1.1;animation-timing-function:cubic-bezier(.34,0,.14,1)}
        69%,100%{stroke-dashoffset:0}
      }
      @keyframes p2m-left-draw{
        0%,45%{stroke-dashoffset:1.1;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        73%,100%{stroke-dashoffset:0}
      }
      @keyframes p2m-right-draw{
        0%,49%{stroke-dashoffset:1.1;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        78%,100%{stroke-dashoffset:0}
      }
      @keyframes p2m-chest-draw{
        0%,58%{stroke-dashoffset:1.1;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        82%,100%{stroke-dashoffset:0}
      }
      @keyframes p2m-body-fill{
        0%,23%{opacity:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        61%,100%{opacity:1}
      }
      @keyframes p2m-tail-fill{
        0%,34%{opacity:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        57%,100%{opacity:1}
      }
      @keyframes p2m-left-eye{
        0%,57%{opacity:0;transform:scale(.85);animation-timing-function:cubic-bezier(.22,1,.36,1)}
        68%,80%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        84%{opacity:1;transform:scaleY(.12);animation-timing-function:cubic-bezier(.22,1,.36,1)}
        90%,100%{opacity:1;transform:none}
      }
      @keyframes p2m-right-eye{
        0%,61%{opacity:0;transform:scale(.85);animation-timing-function:cubic-bezier(.22,1,.36,1)}
        72%,82%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.4,0,.2,1)}
        86%{opacity:1;transform:scaleY(.12);animation-timing-function:cubic-bezier(.22,1,.36,1)}
        93%,100%{opacity:1;transform:none}
      }
    }
  </style>
</head>
<body>
  <div id="logo-root" role="button" tabindex="0" aria-label="重播猫咪动画" data-p2m-duration="1800"></div>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <button type="button" class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">轻抬</span></button>
    <button type="button" class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">呼吸</span></button>
    <button type="button" class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">摆尾</span></button>
    <button type="button" class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">轻按</span></button>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">柔性形变</span>
    <span class="pill" data-p="anticipation">预备</span>
    <span class="pill" data-p="staging">分层呈现</span>
    <span class="pill" data-p="followthrough">余势</span>
    <span class="pill" data-p="overlap">错峰</span>
    <span class="pill" data-p="slowinout">缓入缓出</span>
    <span class="pill" data-p="arc">摆尾</span>
    <span class="pill" data-p="secondary">辅助动作</span>
    <span class="pill" data-p="timing">节奏</span>
    <span class="pill" data-p="appeal">亲和</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">重播</button>
    <button id="btnSlow" type="button">慢动作</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">速度</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="动画速度">
      <span class="speed-value" id="speedValue">1.00x</span>
    </label>
  </div>

  <p class="footer">点击猫咪重播 · 调节速度 · 悬停或点按下方动作</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"width":"480","height":"480","viewBox":"0 0 300 300","role":"img","aria-labelledby":"logo-title"},"children":[{"tag":"title","attrs":{"id":"logo-title"},"children":[],"text":"zerolovesea cat"},{"tag":"g","attrs":{"id":"mark","stroke":"#444b54","stroke-width":"5.8","stroke-linecap":"round","stroke-linejoin":"round"},"children":[{"tag":"g","attrs":{"id":"tail"},"children":[{"tag":"path","attrs":{"id":"tail-fill","fill":"#d3d8dd","stroke":"none","d":"M107 202 L127 207 L139 214 H94 C81 214 82 195 97 199.5 Z"},"children":[]},{"tag":"path","attrs":{"id":"tail-line","fill":"none","pathLength":"1","d":"M107 202 L97 199.5 C82 195 81 214 94 214 L139 214"},"children":[]}]},{"tag":"g","attrs":{"id":"body"},"children":[{"tag":"path","attrs":{"id":"body-fill","stroke":"none","fill":"#d3d8dd","d":"M139 214 C126 214 117 207 121 192 L143 94 C155 108 168 108 178 94 L201 193 C205 205 197 214 184 214 Z"},"children":[]},{"tag":"path","attrs":{"id":"body-line","fill":"none","pathLength":"1","d":"M139 214 C126 214 117 207 121 192 L143 94 C155 108 168 108 178 94 L201 193 C205 205 197 214 184 214"},"children":[]}]},{"tag":"path","attrs":{"id":"leg-left","fill":"none","pathLength":"1","d":"M139 164 L148 207 C150 217 161 216 161 207"},"children":[]},{"tag":"path","attrs":{"id":"leg-right","fill":"none","pathLength":"1","d":"M182 164 L174 207 C172 217 161 216 161 207"},"children":[]},{"tag":"path","attrs":{"id":"chest","fill":"none","pathLength":"1","d":"M161 174 L161 207"},"children":[]},{"tag":"g","attrs":{"id":"face","fill":"#444b54","stroke":"none"},"children":[{"tag":"circle","attrs":{"id":"eye-left","cx":"151","cy":"124","r":"3"},"children":[]},{"tag":"circle","attrs":{"id":"eye-right","cx":"171","cy":"124","r":"3"},"children":[]}]}]}]};
    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"480\" viewBox=\"0 0 300 300\" role=\"img\" aria-labelledby=\"logo-title\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n<title id=\"logo-title\">zerolovesea cat<\/title>\n<g id=\"mark\" stroke=\"#444b54\" stroke-width=\"5.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n <g id=\"tail\"><path id=\"tail-fill\" fill=\"#d3d8dd\" stroke=\"none\" d=\"M107 202 L127 207 L139 214 H94 C81 214 82 195 97 199.5 Z\"/><path id=\"tail-line\" fill=\"none\" pathLength=\"1\" d=\"M107 202 L97 199.5 C82 195 81 214 94 214 L139 214\"/><\/g>\n <g id=\"body\"><path id=\"body-fill\" stroke=\"none\" fill=\"#d3d8dd\" d=\"M139 214 C126 214 117 207 121 192 L143 94 C155 108 168 108 178 94 L201 193 C205 205 197 214 184 214 Z\"/><path id=\"body-line\" fill=\"none\" pathLength=\"1\" d=\"M139 214 C126 214 117 207 121 192 L143 94 C155 108 168 108 178 94 L201 193 C205 205 197 214 184 214\"/><\/g>\n <path id=\"leg-left\" fill=\"none\" pathLength=\"1\" d=\"M139 164 L148 207 C150 217 161 216 161 207\"/>\n <path id=\"leg-right\" fill=\"none\" pathLength=\"1\" d=\"M182 164 L174 207 C172 217 161 216 161 207\"/>\n <path id=\"chest\" fill=\"none\" pathLength=\"1\" d=\"M161 174 L161 207\"/>\n <g id=\"face\" fill=\"#444b54\" stroke=\"none\"><circle id=\"eye-left\" cx=\"151\" cy=\"124\" r=\"3\"/><circle id=\"eye-right\" cx=\"171\" cy=\"124\" r=\"3\"/><\/g>\n<\/g>\n<\/svg>";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1800;

    let playbackRate = 1;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "正常速度" : "慢动作";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    function setupAtomImages() {
      document.querySelectorAll('.atom').forEach(button => {
        const svg = createSvgNode(LOGO), prefix = 'atom-' + button.dataset.atom + '-';
        svg.querySelectorAll('[id]').forEach(node => node.id = prefix + node.id);
        svg.setAttribute('aria-labelledby', prefix + 'logo-title');
        svg.removeAttribute('width');svg.removeAttribute('height');
        button.querySelector('.atom-stage').append(svg);
      });
    }
    function setupAtoms() {
      function play(button) {
        if(reduced.matches)return;
        const kind=button.dataset.atom, svg=button.querySelector('svg');
        const node=svg.querySelector('[id$="'+(kind==='arc'?'tail':'mark')+'"]');
        node.getAnimations().forEach(a=>a.cancel());
        node.style.transformBox=kind==='arc'?'view-box':'fill-box';
        node.style.transformOrigin=kind==='arc'?'139px 214px':'center bottom';
        const frames={
          hover:['none','translateY(-4px) scale(1.02)','none'],
          pulse:['scale(1)','scale(1.025)','scale(1)'],
          arc:['rotate(0deg)','rotate(-5deg)','rotate(1.5deg)','rotate(0deg)'],
          press:['scale(1)','scale(1.035,.965)','scale(.995,1.005)','scale(1)']
        }[kind].map(transform=>({transform}));
        node.animate(frames,{duration:{hover:600,pulse:3200,arc:950,press:550}[kind],easing:'cubic-bezier(.4,0,.2,1)'});
        flashPills(kind==='arc'?'arc':kind==='press'?'squashstretch':'appeal');
      }
      document.querySelectorAll('.atom').forEach(button=>{
        button.addEventListener('pointerenter',()=>play(button));
        button.addEventListener('focus',()=>play(button));
        button.addEventListener('click',()=>play(button));
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById('logo-root').addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();replayMain();}
    });
    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 1 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(1, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
